<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .footer {
  background-color: #f8f9fa;
  padding: 20px 0;
}

.footer .col-md-4 img {
  max-height: 40px;
}

.footer .text-end a {
  margin-left: 10px;
}

.footer .text-end a i {
  font-size: 24px;
  color: #000;
}

  </style>
  <title>My Website</title>
</head>
<body>

<!-- Footer -->
<footer class="footer bg-light mt-4 py-3">
  <div class="container">
    <div class="row">
      <div class="col-md-4">
        <p><strong>Dirección:</strong></p>
        <p>Calle de ejemplo, 123<br>Ciudad, País<br>Teléfono: +123 456 789</p>
      </div>
      <div class="col-md-4 text-center">
        <img src="logo.png" alt="Logo" class="img-fluid">
      </div>
      <div class="col-md-4 text-end">
        <a href="https://facebook.com" target="_blank" class="me-2">
          <i class="bi bi-facebook" style="font-size: 24px;"></i>
        </a>
        <a href="https://twitter.com" target="_blank" class="me-2">
          <i class="bi bi-twitter" style="font-size: 24px;"></i>
        </a>
        <a href="https://instagram.com" target="_blank">
          <i class="bi bi-instagram" style="font-size: 24px;"></i>
        </a>
        <a href="https://tiktok.com" target="_blank">
          <i class="bi bi-tiktok" style="font-size: 24px;"></i>
        </a>
      </div>
    </div>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
