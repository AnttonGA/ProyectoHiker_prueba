<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route — Hiker</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">

  <!-- Leaflet + elevation -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.css" />
  <link href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css" rel="stylesheet" />

  <!-- Bootstrap + icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="../estilos2.css" rel="stylesheet">
  <link href="css/ruta.css" rel="stylesheet">
</head>

<body>
  <div id="menu"></div>

  <!-- ── Hero ─────────────────────────────────────────── -->
  <div class="ruta-hero">
    <div class="ruta-hero__overlay">
      <div class="container-xl">
        <nav aria-label="breadcrumb" class="ruta-breadcrumb">
          <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item">
              <a href="skitouring.html"><i class="bi bi-search me-1"></i>Search</a>
            </li>
            <li class="breadcrumb-item active" id="breadcrumb-title">Route</li>
          </ol>
        </nav>
        <h1 class="ruta-hero__title" id="ruta-title">Loading…</h1>
        <div class="ruta-hero__badges mt-2">
          <span id="hero-difficulty-badge" class="ruta-badge diff--easy d-none"></span>
          <span id="hero-activity-badge" class="ruta-badge ruta-badge--activity d-none"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Main ─────────────────────────────────────────── -->
  <main class="container-xl py-4">
    <div class="row g-4">

      <!-- ════ LEFT COLUMN ════ -->
      <div class="col-lg-8">

        <!-- Map -->
        <div id="map" class="ruta-map mb-3"></div>

        <!-- Elevation profile -->
        <div class="ruta-card mb-3">
          <div class="ruta-card__header">
            <i class="bi bi-graph-up"></i> Elevation Profile
          </div>
          <div class="ruta-card__body p-0">
            <div id="elevation-profile"></div>
          </div>
        </div>

        <!-- Stats bar -->
        <div class="ruta-stats-bar mb-3">
          <div class="ruta-stat">
            <i class="bi bi-arrow-up-short ruta-stat__icon"></i>
            <span class="ruta-stat__value" id="ruta-elevation">—</span>
            <span class="ruta-stat__label">Elevation</span>
          </div>
          <div class="ruta-stat">
            <i class="bi bi-arrows-expand ruta-stat__icon"></i>
            <span class="ruta-stat__value" id="ruta-distance">—</span>
            <span class="ruta-stat__label">Distance</span>
          </div>
          <div class="ruta-stat">
            <i class="bi bi-clock ruta-stat__icon"></i>
            <span class="ruta-stat__value" id="ruta-duration">—</span>
            <span class="ruta-stat__label">Duration</span>
          </div>
          <div class="ruta-stat">
            <i class="bi bi-signal ruta-stat__icon"></i>
            <span class="ruta-stat__value" id="ruta-difficulty">—</span>
            <span class="ruta-stat__label">Difficulty</span>
          </div>
          <div class="ruta-stat">
            <i class="bi bi-geo-alt ruta-stat__icon"></i>
            <span class="ruta-stat__value" id="ruta-location">—</span>
            <span class="ruta-stat__label">Location</span>
          </div>
          <div class="ruta-stat">
            <i class="bi bi-lightning ruta-stat__icon"></i>
            <span class="ruta-stat__value" id="ruta-activity">—</span>
            <span class="ruta-stat__label">Activity</span>
          </div>
        </div>

        <!-- Action bar -->
        <div class="ruta-actions mb-4">
          <p id="ruta-author" class="ruta-author">
            <i class="bi bi-person-circle"></i> <span></span>
          </p>
          <div class="ruta-actions__btns">
            <button id="btn-favorite" class="btn btn-outline-primary btn-sm">
              <i class="bi bi-heart"></i> Favorite
            </button>
            <button id="btn-add-to-list" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-bookmark-plus"></i> Add to List
            </button>
            <button id="btn-completed" class="btn btn-outline-success btn-sm">
              <i class="bi bi-check-circle"></i> Mark as Completed
            </button>
            <div id="ruta-download" class="d-inline-block"></div>
          </div>
        </div>

        <!-- Description -->
        <div class="ruta-card mb-3">
          <div class="ruta-card__header">
            <i class="bi bi-file-text"></i> Description
          </div>
          <div class="ruta-card__body">
            <p id="ruta-description" class="mb-0 text-muted lh-lg"></p>
          </div>
        </div>

        <!-- Additional info -->
        <div class="ruta-card mb-4" id="ruta-preguntas-wrap" style="display:none;">
          <div class="ruta-card__header">
            <i class="bi bi-info-circle"></i> Additional Information
          </div>
          <div class="ruta-card__body">
            <div id="ruta-preguntas"></div>
          </div>
        </div>

        <!-- Back -->
        <button onclick="history.back()" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>Back to Search
        </button>

      </div><!-- /col-lg-8 -->

      <!-- ════ RIGHT COLUMN ════ -->
      <div class="col-lg-4">

        <!-- Quick info card -->
        <div class="ruta-card mb-3">
          <div class="ruta-card__header">
            <i class="bi bi-info-square"></i> Route Info
          </div>
          <div class="ruta-card__body p-0">
            <table class="table table-sm table-borderless mb-0 ruta-info-table">
              <tbody>
                <tr>
                  <td class="text-muted"><i class="bi bi-signal"></i> Difficulty</td>
                  <td><span id="ruta-difficulty-2" class="difficulty-badge"></span></td>
                </tr>
                <tr>
                  <td class="text-muted"><i class="bi bi-geo-alt"></i> Location</td>
                  <td id="ruta-location-2">—</td>
                </tr>
                <tr>
                  <td class="text-muted"><i class="bi bi-lightning"></i> Activity</td>
                  <td id="ruta-activity-2">—</td>
                </tr>
                <tr>
                  <td class="text-muted"><i class="bi bi-arrow-up-short"></i> Elevation</td>
                  <td id="ruta-elevation-2">—</td>
                </tr>
                <tr>
                  <td class="text-muted"><i class="bi bi-arrows-expand"></i> Distance</td>
                  <td id="ruta-distance-2">—</td>
                </tr>
                <tr>
                  <td class="text-muted"><i class="bi bi-clock"></i> Duration</td>
                  <td id="ruta-duration-2">—</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Gallery -->
        <div class="ruta-card">
          <div class="ruta-card__header">
            <i class="bi bi-images"></i> Photos
          </div>
          <div class="ruta-card__body p-0">
            <div id="ruta-gallery" class="ruta-gallery"></div>
          </div>
        </div>

      </div><!-- /col-lg-4 -->

    </div><!-- /row -->
  </main>

  <div id="footer"></div>

  <!-- ── Add-to-List Modal ─────────────────────────────── -->
  <div class="modal fade" id="listModal" tabindex="-1" aria-labelledby="listModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="listModalLabel">
            <i class="bi bi-bookmark-plus me-2"></i>Add to List
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="existingLists" class="mb-3"></div>
          <hr>
          <div class="mb-2">
            <label for="newListName" class="form-label fw-semibold small">Create New List</label>
            <input type="text" class="form-control form-control-sm" id="newListName"
                   placeholder="Enter new list name…">
            <span class="feedback-text text-danger ms-2"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Close</button>
          <button id="createNewList" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Create and Add
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox overlay (populated by JS) -->
  <div id="lightbox-overlay" class="lightbox-overlay" style="display:none;">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>
    <img id="lightbox-img" src="" alt="Enlarged photo">
  </div>

  <!-- ── Scripts ──────────────────────────────────────── -->
  <!-- Leaflet must load before paginaunica.js -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <!-- Shim to silence optional leaflet-rotate dependency warning -->
  <script>window.L = window.L || {}; if(window.L) window.L.Map && (window.L.Map.mergeOptions && window.L.Map.mergeOptions({rotate:false}));</script>
  <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-gpx/gpx.min.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>

  <!-- App scripts -->
  <script src="javascript/paginaunica.js"></script>
  <script src="javascript/bt_fav.js"></script>
  <script src="javascript/bt_lists.js"></script>
  <script src="javascript/bt_completed.js"></script>
  <script src="javascript/user_preferences.js"></script>
  <script src="../../include.js"></script>

</body>
</html>
