<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkiTouring</title>
  <!-- Mapa Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link href='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css' rel='stylesheet' />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../estilos2.css" rel="stylesheet">
  <!-- Bootstrap icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Swiper CSS -->
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

</head>
 <!-- Navbar -->
 <div id="menu"></div>
<body>
   

  <!-- Header -->
  <div class="header">
    <div class="overlay">
      <h1>FIND YOUR NEXT ADVENTURE</h1>
    </div>
  </div>

  <nav>
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="map-tab" data-bs-toggle="tab" data-bs-target="#map-content" type="button" role="tab" aria-controls="map-content" aria-selected="true">Map</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="list-tab" data-bs-toggle="tab" data-bs-target="#list-content" type="button" role="tab" aria-controls="list-content" aria-selected="false">List</button>
        </li>
    </ul>
</nav>

<div class="tab-content" id="myTabContent">
    <!-- Map Tab -->
    <div class="tab-pane fade show active" id="map-content" role="tabpanel" aria-labelledby="map-tab">
        <div id="routes" class="container-fluid mt-4">
            <div class="row">
                <div class="col-md-3">
                    <!-- Filters -->
                    <div class="mb-3">
                        <label for="filtroRefugio" class="form-label">Filter by shelter type:</label>
                        <select id="filtroRefugio" class="form-select">
                            <option value="all" selected>All types</option>
                            <option value="cabane ouverte">Open shelter</option>
                            <option value="cabane fermee">Closed shelter</option>
                            <option value="cabane ouverte mais ocupee par le berger l ete">Open shelter occupied by shepherd in summer</option>
                            <option value="orri toue abri en pierre">Stone shelter</option>
                            <option value="refuge garde l ete partie hivernal">Summer-manned refuge, partly open in winter</option>
                            <option value="refuge garde toute l annee">Year-round manned refuge</option>
                            <option value="ruine">Ruin</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <button id="aplicarFiltro" class="btn btn-primary w-100">Apply Shelter Filter</button>
                    </div>
                    <div class="mb-3">
                        <label for="difficultyFilter" class="form-label">Difficulty:</label>
                        <select id="difficultyFilter" class="form-select">
                            <option value="all">All</option>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="minElevation" class="form-label">Minimum Elevation Gain (m):</label>
                        <input type="number" id="minElevation" class="form-control" min="0">
                    </div>
                    <div class="mb-3">
                        <label for="maxDuration" class="form-label">Maximum Duration (hours):</label>
                        <input type="number" id="maxDuration" class="form-control" min="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Activities:</label>
                        <div id="activityFilter" class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="ski_touring" id="skiTouring">
                                <label class="form-check-label" for="skiTouring">Ski Touring</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="cycle_touring" id="cycleTouring">
                                <label class="form-check-label" for="cycleTouring">Cycle Touring</label>
                            </div>
                            <!-- Add more activities as needed -->
                        </div>
                    </div>
                    <div class="mb-3">
                        <button id="filterButton" class="btn btn-primary w-100">Apply Route Filters</button>
                    </div>
                </div>
                <div class="col-md-9">
                    <div id="map" style="height: 80vh; width: 100%;"></div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>SUGGESTED ADVENTURES</h3>
                <div class="swiper-container">
                    <div id="cards-container" class="swiper-wrapper">
                        <!-- Cards will be populated here by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- List Tab -->
    <div id="list-content" class="tab-pane fade" role="tabpanel" aria-labelledby="list-tab">
        <div class="container-fluid">
            <h2 class="my-4">Adventure Routes</h2>
            
            <!-- Filter form -->
            <form id="filter-form" class="row g-3 mb-4">
                <div class="col-md-3">
                    <label for="filter-difficulty" class="form-label">Difficulty:</label>
                    <select id="filter-difficulty" class="form-select">
                        <option value="all">All</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filter-min-elevation" class="form-label">Minimum Elevation Gain (m):</label>
                    <input type="number" class="form-control" id="filter-min-elevation" min="0">
                </div>
                <div class="col-md-3">
                    <label for="filter-max-duration" class="form-label">Maximum Duration (hours):</label>
                    <input type="number" class="form-control" id="filter-max-duration" min="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Activities:</label>
                    <div id="activityFilter" class="d-flex flex-wrap gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="ski_touring" id="skiTouring">
                            <label class="form-check-label" for="skiTouring">Ski Touring</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="cycle_touring" id="cycleTouring">
                            <label class="form-check-label" for="cycleTouring">Cycle Touring</label>
                        </div>
                        <!-- Add more activities as needed -->
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Apply Filters</button>
                </div>
            </form>
    
            <div class="row mt-4">
                <div class="col-12">
                    <h3>SUGGESTED ADVENTURES</h3>
                    <div class="swiper-container">
                        <div id="cards-container2" class="swiper-wrapper">
                            <!-- Cards will be populated here by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
    
            <h3 class="mt-4">ADVENTURES LIST</h3>
            <div id="routes-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
                <!-- Routes will be populated here by JavaScript -->
            </div>
    
            <div id="pagination" class="my-4 text-center">
                <!-- Pagination will be populated here by JavaScript -->
            </div>
        </div>
    </div>

<div id="footer">
    <!-- Your footer content -->
</div>



  <!-- Scripts al final del body para mejorar el rendimiento de carga -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
 <script src="javascript/mapa.js"></script>
  <script src="javascript/carrusel.js"></script>
  <script src="javascript/lista.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-gpx/gpx.min.js"></script>
  <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js'></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="../../include.js"></script>
  
  <!-- Swiper JS -->
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  

</body>
</html>
