<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../estilos2.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        .header {
            position: relative;
            text-align: center;
            color: white;
            background: url('https://source.unsplash.com/1600x900/?nature,trail') no-repeat center center;
            background-size: cover;
            height: 300px;
        }
        .header .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header h1 {
            font-size: 2.5rem;
            margin: 0;
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
        }
        @media (max-width: 576px) {
            .header {
                height: 200px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="menu">
        <!-- Aquí iría el contenido del menú -->
    </div>

    <!-- Header -->
    <div class="header">
        <div class="overlay">
            <h1>UPLOAD YOUR ROUTE</h1>
        </div>
    </div>

    <div class="container mt-5">
        <h2>Upload your route</h2>
        <form id="formularioRuta" action="procesar_subida.php" method="POST" enctype="multipart/form-data">
            <div id="step1">
                <h3>Step 1: Basic information</h3>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Name of the route</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="tipo_ruta" class="form-label">Type of route</label>
                    <select class="form-select" id="tipo_ruta" name="tipo_ruta" required>
                        <option value="">Choose a type of route</option>
                        <option value="ski_touring">Ski Touring</option>
                        <option value="hiking">Hiking</option>
                        <option value="cycle_touring">Cycle Touring</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="location_ruta" class="form-label">Route location</label>
                    <select class="form-select" id="location_ruta" name="location_ruta" required>
                        <option value="">Choose the location of the route</option>
                        <option value="Western_Pyrenees">Western Pyrenees</option>
                        <option value="Central_Pyrenees">Central Pyrenees</option>
                        <option value="Eastern_Pyrenees">Eastern Pyrenees</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="dificultad" class="form-label">Route difficulty</label>
                    <select class="form-select" id="dificultad" name="dificultad" required>
                        <option value="">Choose the difficulty</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                    <div class="invalid-feedback"></div>
                </div>
                <button type="button" id="nextStep1" class="btn btn-primary">Next step</button>
            </div>

            <div id="step2" style="display: none;">
                <h3>Step 2: Route Notes</h3>
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Description</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="pregunta1" class="form-label">Pregunta 1</label>
                    <input type="text" class="form-control" id="pregunta1" name="pregunta1" required>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="pregunta2" class="form-label">Pregunta 2</label>
                    <input type="text" class="form-control" id="pregunta2" name="pregunta2" required>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="pregunta3" class="form-label">Pregunta 3</label>
                    <input type="text" class="form-control" id="pregunta3" name="pregunta3" required>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="pregunta4" class="form-label">Pregunta 4</label>
                    <input type="text" class="form-control" id="pregunta4" name="pregunta4" required>
                    <div class="invalid-feedback"></div>
                </div>
                <button type="button" id="prevStep1" class="btn btn-secondary">Go back</button>
                <button type="button" id="nextStep2" class="btn btn-primary">Next step</button>
            </div>

            <div id="step3" style="display: none;">
                <h3>Step 3: Upload files</h3>
                <div class="mb-3">
                    <label for="archivo_gpx" class="form-label">GPX files</label>
                    <input type="file" class="form-control" id="archivo_gpx" name="archivo_gpx" required>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="imagenes" class="form-label">Route pictures</label>
                    <input type="file" class="form-control" id="imagenes" name="imagenes[]" multiple required>
                    <div class="invalid-feedback"></div>
                </div>
                <button type="button" id="prevStep2" class="btn btn-secondary">Back</button>
                <button type="submit" class="btn btn-success">Upload route</button>
            </div>
        </form>
    </div>

    <div id="footer">
        <!-- Aquí iría el contenido del pie de página -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascript/validation.js"></script>
    <script src="../../include.js"></script>
   
</body>
</html>
